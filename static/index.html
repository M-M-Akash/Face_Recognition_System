<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #2a2e38; --text: #e6e8ee;
    --muted: #9aa3b2; --accent: #4f8cff; --ok: #3ddc84; --warn: #ffb020; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; padding: 20px; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 13px; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .cam { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cam header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); }
  .cam img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; }
  .controls { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .fps { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .diag-btn { font-family: monospace; width: 22px; padding: 2px 0; }
  .diag { display: none; padding: 8px 10px; border-top: 1px solid var(--line);
          font-size: 12px; font-variant-numeric: tabular-nums; }
  .diag-row { color: var(--muted); margin: 2px 0; }
  .diag-row b { color: var(--text); font-weight: 500; }
  .diag-row .hot { color: var(--warn); }
  .diag-row.warnrow { color: var(--bad); }
  .badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn);
           border-radius: 99px; padding: 1px 8px; display: none; }
  .toggle { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: transparent;
            border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
  .toggle.on { border-color: var(--ok); color: var(--ok); }
  .toggle:disabled { opacity: .4; cursor: not-allowed; }
  .toggle.blocked { border-color: var(--bad); color: var(--bad); opacity: 1; }
  .spoof-badge { color: var(--bad); border-color: var(--bad); }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  /* Enrollment is the one panel someone stands in front of and interacts with,
     so it gets the width the sightings log used to occupy. */
  .enroll-panel { grid-column: span 2; }
  @media (max-width: 800px) { .enroll-panel { grid-column: span 1; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                  padding: 8px 10px; width: 100%; margin-bottom: 10px; }
  button { background: var(--accent); border: 0; border-radius: 8px; padding: 8px 14px; color: #fff; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  #pause-btn { margin-left: auto; }
  #pause-btn.paused { border-color: var(--bad); color: var(--bad); }
  /* Enrollment ring. The camera sits in a circular mask inside a dial of ticks;
     each tick belongs to one of the three real pose bins and lights as that bin
     fills, so the dial renders actual captured state rather than decoration.
     Sized in % of the wrapper (not px) so the whole dial scales with it — the
     person being enrolled needs to actually see their own face. */
  .ring-wrap { position: relative; width: min(520px, 100%); aspect-ratio: 1;
               margin: 14px auto 6px; }
  /* the ring is the focus while enrolling, so centre what sits under it */
  #enroll-live { text-align: center; }
  #enroll-live #warning { max-width: 46ch; margin: 0 auto; }
  /* Not mirrored: the server draws the enrollment overlay text onto the frame,
     so a CSS flip would render that text backwards. Scaled up because that same
     overlay is sized for a 640px frame and is illegible clutter inside the
     circle — the zoom pushes it outside, leaving just the face. The instruction
     and counts are rendered as real text below the ring anyway. */
  .ring-wrap .video-clip { position: absolute; left: 10%; top: 10%; width: 80%; height: 80%;
                           border-radius: 50%; overflow: hidden; background: #000; }
  .ring-wrap img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.7); }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ring line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; transition: stroke .2s; }
  #ring line.lit { stroke: var(--ok); }
  #ring line.active { stroke: var(--accent); }
  #aim { fill: var(--accent); opacity: 0; transition: opacity .2s; }
  #aim.on { opacity: 1; }
  #pose-counts { display: flex; gap: 14px; justify-content: center; margin: 4px 0 2px; }
  .pose-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pose-count.done .count { color: var(--ok); }
  .pose-count.active { color: var(--text); }
  #instruction { font-size: 16px; font-weight: 600; margin: 10px 0 2px; min-height: 24px; }
  #problem { color: var(--warn); min-height: 21px; }
  #warning { color: var(--bad); }
  #message { color: var(--ok); margin-top: 8px; min-height: 21px; }
  .hint { color: var(--muted); margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td button { background: transparent; border: 1px solid var(--line); color: var(--bad); padding: 2px 10px; }
  .muted { color: var(--muted); }
  .event { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .event:last-child { border-bottom: 0; }
  .event img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .event .who { min-width: 0; }
  .event .time { margin-left: auto; flex: none; font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Face Recognition</h1>
  <button id="pause-btn" class="secondary"></button>
</div>

<div id="grid"></div>

<div class="panels">
  <div class="panel enroll-panel">
    <h2>Enroll a person</h2>
    <div id="enroll-form">
      <input id="name" placeholder="Person's name" autocomplete="off">
      <select id="cam-select"></select>
      <button onclick="startEnroll()">Start guided enrollment</button>
      <p class="hint">The person faces the selected camera and follows the prompts
      shown on its stream: front, then left, then right.</p>
    </div>
    <div id="enroll-live" style="display:none">
      <div id="enroll-title" class="muted"></div>
      <div class="ring-wrap">
        <div class="video-clip"><img id="enroll-video" alt=""></div>
        <svg id="ring" viewBox="0 0 260 260" aria-hidden="true">
          <g id="ticks"></g>
          <circle id="aim" cx="130" cy="130" r="5"></circle>
        </svg>
      </div>
      <div id="instruction"></div>
      <div id="problem"></div>
      <!-- Numeric progress stays as text beside the ring: a purely graphical
           indicator would be unreadable to a screen reader, and failing to
           enroll means being unable to be marked present. -->
      <div id="pose-counts" role="status" aria-live="polite">
        <span class="pose-count" id="pose-center"><span class="label">center</span> <span class="count"></span></span>
        <span class="pose-count" id="pose-left"><span class="label">left</span> <span class="count"></span></span>
        <span class="pose-count" id="pose-right"><span class="label">right</span> <span class="count"></span></span>
      </div>
      <div id="warning"></div>
      <button class="secondary" onclick="cancelEnroll()" style="margin-top:10px">Cancel</button>
    </div>
    <div id="message"></div>
  </div>

  <div class="panel">
    <h2>Captured photos</h2>
    <div id="captures"></div>
  </div>

  <div class="panel">
    <h2>Enrolled people</h2>
    <table>
      <thead><tr><th>Name</th><th>Samples</th><th></th></tr></thead>
      <tbody id="people-body"></tbody>
    </table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

async function patchCam(id, body) {
  await fetch('/api/cameras/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  loadCameras();
}

function renderPause(paused) {
  const btn = $('#pause-btn');
  btn.textContent = paused ? 'Recognition paused — resume' : 'Pause all recognition';
  btn.classList.toggle('paused', paused);
  btn.onclick = async () => {
    await fetch('/api/recognition', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paused: !paused })
    });
    loadCameras();
  };
}

// Which cameras have the diagnostics panel open. The point of this panel is to
// tell a server bottleneck from a client one: if process_fps is healthy but
// stream_fps is well below it, the browser is behind and no server-side tuning
// will help.
const showDiag = new Set();

let lastCpu = null;      // process-wide, shared by every camera's panel

function renderDiag(d) {
  const s = d.stage_ms || {};
  const worst = Object.entries(s).sort((a, b) => b[1] - a[1])[0];
  const bar = Object.entries(s).filter(([, v]) => v > 0.01).map(([k, v]) =>
    `<span class="${k === worst[0] ? 'hot' : ''}">${k} ${v.toFixed(1)}</span>`).join(' · ');
  const warn = [];
  if (d.capture_fps && d.capture_fps < 15) warn.push('camera/decode is short');
  if (d.dropped_per_frame > 0.5) warn.push('loop behind the camera');
  if (d.latency_ms > 300) warn.push('frames are stale');
  if (d.viewers > 0 && d.stream_fps && d.process_fps &&
      d.stream_fps < d.process_fps * 0.6) warn.push('viewer is behind, not the server');
  if (lastCpu && lastCpu.saturated)
    warn.push(`CPU saturated (${lastCpu.cores_used}/${lastCpu.cores_available} cores)` +
              ' — this browser is competing with it');
  const cpu = lastCpu
    ? ` · <b>cpu</b> ${lastCpu.cores_used}/${lastCpu.cores_available} cores` : '';
  return `
    <div class="diag-row"><b>capture</b> ${d.capture_fps} fps ·
      <b>processed</b> ${d.process_fps} fps ·
      <b>streamed</b> ${d.viewers ? d.stream_fps + ' fps' : '—'}${cpu}</div>
    <div class="diag-row">dropped ${d.dropped_per_frame}/frame ·
      latency ${d.latency_ms} ms · frame ${d.frame_ms} ms ·
      rec ${d.recognitions_per_frame}/frame</div>
    <div class="diag-row">${bar}</div>
    ${warn.length ? `<div class="diag-row warnrow">${warn.join(' · ')}</div>` : ''}`;
}

async function loadCameras() {
  const data = await (await fetch('/api/cameras')).json();
  lastCpu = data.cpu || null;
  renderPause(data.paused);
  const grid = $('#grid');
  for (const c of data.cameras) {
    let card = document.getElementById('cam' + c.id);
    if (!card) {
      card = document.createElement('div');
      card.className = 'cam';
      card.id = 'cam' + c.id;
      card.innerHTML = `
        <header><span class="dot"></span><strong>Camera ${c.id}</strong>
        <div class="controls">
          <span class="fps" title="Frames per second actually processed"></span>
          <button class="toggle diag-btn" title="Show where the time goes">i</button>
          <span class="badge">ENROLLING</span>
          <span class="badge spoof-badge">SPOOF?</span>
          <button class="toggle shot" title="Take an attendance photo">PHOTO</button>
          <button class="toggle rec" title="Recognition on/off">REC</button>
          <button class="toggle power" title="Camera on/off">ON</button>
        </div></header>
        <img src="/stream/${c.id}" alt="Camera ${c.id}">
        <div class="diag"></div>`;
      grid.appendChild(card);
    }
    card.querySelector('.dot').classList.toggle('on', c.connected);
    card.querySelector('.fps').textContent = c.fps
      ? `${c.fps.toFixed(1)} fps${c.recognition ? ` · ${c.embeds.toFixed(2)} rec/f` : ''}` : '';
    card.querySelector('.badge').style.display = c.enrolling ? 'inline-block' : 'none';
    const power = card.querySelector('.power');
    power.classList.toggle('on', c.enabled);
    power.textContent = c.enabled ? 'ON' : 'OFF';
    power.onclick = () => patchCam(c.id, { enabled: !c.enabled });
    const rec = card.querySelector('.rec');
    rec.classList.toggle('on', c.recognition);
    rec.onclick = () => patchCam(c.id, { recognition: !c.recognition });
    card.querySelector('.spoof-badge').style.display = c.spoof ? 'inline-block' : 'none';
    const diagBtn = card.querySelector('.diag-btn');
    const diagBox = card.querySelector('.diag');
    diagBtn.classList.toggle('on', showDiag.has(c.id));
    diagBtn.onclick = () => {
      showDiag.has(c.id) ? showDiag.delete(c.id) : showDiag.add(c.id);
      loadCameras();
    };
    diagBox.style.display = showDiag.has(c.id) ? 'block' : 'none';
    if (showDiag.has(c.id) && c.diag) diagBox.innerHTML = renderDiag(c.diag);
    const shot = card.querySelector('.shot');
    const canShoot = c.enabled && c.connected && c.recognition && !data.paused;
    shot.disabled = !canShoot || c.spoof;
    shot.classList.toggle('blocked', c.spoof);
    shot.title = c.spoof ? 'Suspected photo or screen — capture blocked'
      : canShoot ? 'Take an attendance photo'
      : 'Camera and recognition must both be on';
    shot.onclick = () => takePhoto(c.id);
  }
  const sel = $('#cam-select');
  const current = sel.value;
  sel.innerHTML = data.cameras.map(c => {
    const ready = c.enabled && c.connected;
    const note = !c.enabled ? ' (stopped)' : (!c.connected ? ' (offline)' : '');
    return `<option value="${c.id}" ${ready ? '' : 'disabled'}>Camera ${c.id}${note}</option>`;
  }).join('');
  if (current) sel.value = current;
}

function fmtTime(utc) {
  return new Date(utc.replace(' ', 'T') + 'Z').toLocaleString();
}

async function takePhoto(id) {
  const btn = document.querySelector('#cam' + id + ' .shot');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await fetch('/api/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera: id })
    });
    if (!r.ok) alert((await r.json()).detail || 'Could not take the photo');
    else loadCaptures();
  } finally {
    btn.textContent = 'PHOTO';
    loadCameras();     // re-derives disabled state from the live camera status
  }
}

async function loadCaptures() {
  const shots = await (await fetch('/api/captures?limit=30')).json();
  $('#captures').innerHTML = shots.length
    ? shots.map(s => {
      const live = s.liveness == null ? '' : ` · live ${s.liveness.toFixed(2)}`;
      const sim = s.similarity == null ? '' : ` · ${s.similarity.toFixed(2)}`;
      return `
      <div class="event">
        <img src="/api/captures/${s.id}/photo" loading="lazy"
             onerror="this.style.visibility='hidden'">
        <div class="who"><strong>${s.person}</strong>
          <span class="muted">camera ${s.camera}${sim}${live}</span></div>
        <span class="muted time">${fmtTime(s.created_at)}</span>
      </div>`;
    }).join('')
    : '<p class="muted">No photos taken yet</p>';
}

async function loadPeople() {
  const people = await (await fetch('/api/people')).json();
  $('#people-body').innerHTML = people.length
    ? people.map(p => `<tr><td>${p.name}</td><td>${p.samples}</td>
        <td><button onclick="delPerson('${p.name.replace(/'/g, "\\'")}')">delete</button></td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">No one enrolled yet</td></tr>';
}

async function delPerson(name) {
  if (!confirm(`Delete '${name}' and all their samples?`)) return;
  await fetch('/api/people/' + encodeURIComponent(name), { method: 'DELETE' });
  loadPeople();
}

// --- enrollment ring -------------------------------------------------------
// 48 ticks around an ellipse, split into three arcs that map onto the real pose
// bins. Left/right are the outer arcs, centre the top span. A tick lights when
// its arc's captured count reaches it, so the dial always agrees with the
// numeric counts beside it.
const RING = { ticks: 48, cx: 130, cy: 130, rx: 108, ry: 108, inner: 96 };
// Arc spans in degrees around the dial, 0 = top, positive = clockwise.
// The pose names are the PERSON'S own left/right, and the video is not mirrored,
// so their left appears on the viewer's right. The arcs are placed to match where
// the marker actually travels — otherwise the arc would fill on the opposite side
// from the moving dot.
const ARCS = { right: [-105, -35], center: [-25, 25], left: [35, 105] };
// how far the head can turn before the marker pins to the edge of the dial
const AIM_RANGE = { yaw: 40, pitch: 22 };

function buildRing() {
  const g = document.getElementById('ticks');
  if (g.childElementCount) return;               // built once, like the cam cards
  for (let i = 0; i < RING.ticks; i++) {
    const deg = -180 + (360 * i) / RING.ticks;
    const rad = (deg - 90) * Math.PI / 180;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', RING.cx + RING.inner * Math.cos(rad));
    line.setAttribute('y1', RING.cy + RING.inner * Math.sin(rad));
    line.setAttribute('x2', RING.cx + RING.rx * Math.cos(rad));
    line.setAttribute('y2', RING.cy + RING.ry * Math.sin(rad));
    line.dataset.deg = deg;
    g.appendChild(line);
  }
}

let aimEma = null;    // pose jitters +/-3-5 deg; smooth it or the marker shakes
function renderRing(s) {
  buildRing();
  const needed = s.needed || 1;
  const ticks = [...document.getElementById('ticks').children];
  for (const line of ticks) {
    const deg = parseFloat(line.dataset.deg);
    let lit = false, active = false;
    for (const [pose, [from, to]] of Object.entries(ARCS)) {
      if (deg < from || deg > to) continue;
      const done = (s.counts && s.counts[pose]) || 0;
      // fraction of this arc lit == fraction of that pose's samples captured
      lit = (deg - from) / (to - from) < done / needed;
      active = pose === s.pose;
    }
    line.classList.toggle('lit', lit);
    line.classList.toggle('active', active && !lit);
  }

  const aim = document.getElementById('aim');
  if (s.yaw == null || s.pitch == null) {
    aim.classList.remove('on');
    aimEma = null;
    return;
  }
  const target = { yaw: s.yaw, pitch: s.pitch };
  aimEma = aimEma
    ? { yaw: aimEma.yaw + 0.35 * (target.yaw - aimEma.yaw),
        pitch: aimEma.pitch + 0.35 * (target.pitch - aimEma.pitch) }
    : target;
  const clamp = (v, m) => Math.max(-1, Math.min(1, v / m));
  // image is not mirrored, so the person's own left appears on the viewer's right
  aim.setAttribute('cx', RING.cx + clamp(aimEma.yaw, AIM_RANGE.yaw) * RING.inner);
  aim.setAttribute('cy', RING.cy - clamp(aimEma.pitch, AIM_RANGE.pitch) * RING.inner);
  aim.classList.add('on');
}

async function startEnroll() {
  const name = $('#name').value.trim();
  if (!name) { alert('Enter a name first'); return; }
  const r = await fetch('/api/enroll/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, camera: parseInt($('#cam-select').value) })
  });
  if (!r.ok) alert((await r.json()).detail || 'Could not start enrollment');
  pollEnroll();
}

async function cancelEnroll() {
  await fetch('/api/enroll/cancel', { method: 'POST' });
  pollEnroll();
}

let wasActive = false;
async function pollEnroll() {
  const s = await (await fetch('/api/enroll/status')).json();
  const active = !!s.active;
  $('#enroll-form').style.display = active ? 'none' : 'block';
  $('#enroll-live').style.display = active ? 'block' : 'none';
  if (active) {
    $('#enroll-title').textContent = `Enrolling '${s.name}' on camera ${s.camera}`;
    $('#instruction').textContent = s.instruction || '';
    $('#problem').textContent = s.problem || '';
    $('#warning').textContent = s.warning ? s.warning + ' — continuing anyway.' : '';
    const video = $('#enroll-video');
    const src = '/stream/' + s.camera;
    if (!video.getAttribute('src') || !video.getAttribute('src').endsWith(src)) {
      video.src = src;                      // only reassign on a camera change
      video.alt = `Camera ${s.camera}`;
    }
    for (const [pose, n] of Object.entries(s.counts)) {
      const row = document.getElementById('pose-' + pose);
      if (!row) continue;
      row.querySelector('.count').textContent = `${n}/${s.needed}`;
      row.classList.toggle('done', n >= s.needed);
      row.classList.toggle('active', pose === s.pose);
    }
    renderRing(s);
  }
  $('#message').textContent = (!active && s.state !== 'idle') ? (s.message || '') : '';
  if (wasActive && !active) {
    loadPeople(); loadCameras(); $('#name').value = '';
    $('#enroll-video').removeAttribute('src');   // stop pulling the MJPEG
    aimEma = null;
  }
  wasActive = active;
}

loadCameras();
loadPeople();
loadCaptures();
pollEnroll();
// faster than the other panels: this drives the SPOOF badge and whether PHOTO is
// clickable, which should not lag several seconds behind the red box on the video
setInterval(loadCameras, 1500);
setInterval(loadCaptures, 5000);
setInterval(pollEnroll, 600);
</script>
</body>
</html>
